name: Эта — Eta (macOS Intel .dmg)

# push only: for pull_request GitHub matches `paths` against the whole PR diff, which rebuilt every app
on:
  push:
    branches: ["**"]
    tags:
      - "eta-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Опубликовать релиз eta-v<версия> (пусто — просто собрать)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    env:
      PYTHON_VERSION: "3.11.9"
      ETA_CURSEFORGE_KEY: ${{ secrets.ETA_CURSEFORGE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install python.org Python (universal2, runs on macOS 10.9+)
        run: |
          curl -fsSLo /tmp/python.pkg "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv "$RUNNER_TEMP/venv"
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          $PYTHON -m pip install --upgrade pip
          $PYTHON -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Self-test from source
        run: $PYTHON run.py --selftest

      - name: Build app + dmg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/eta-v* ]]; then export APP_VERSION="${GITHUB_REF#refs/tags/eta-v}"; fi
          if [[ -n "${{ inputs.release_version }}" ]]; then export APP_VERSION="${{ inputs.release_version }}"; fi
          PATH="$(dirname "$PYTHON"):$PATH" packaging/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Eta-macOS-x64
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/eta-v') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version != '' && format('eta-v{0}', inputs.release_version) || github.ref_name }}
          name: Эта ${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
          files: dist/*.dmg
